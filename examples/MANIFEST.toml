# Every upstream example and its Lean port (checked by
# stack-tools/check-examples.py). MarkupSafe ships no example programs, so its
# examples are the Python code blocks of its README and docs pages, one Lean
# file per page. docs/escaping.rst is autodoc: its examples are the docstrings
# it renders (escape, Markup, Markup.unescape, Markup.striptags, escape_silent,
# soft_str), ported in examples/Escaping.lean. The checker counts every `>>> `
# line at the start of a line as a block, so README.md and docs/index.rst have
# one row per statement.

[meta]
upstream = "markupsafe"
doc_pages = ["README.md", "docs/index.rst", "docs/escaping.rst", "docs/html.rst",
  "docs/formatting.rst"]

[[example]]
upstream = "README.md#block-1 (the pycon block)"
lean = "examples/Readme.lean"
status = "ported"
reason = ""
output = "tests/Conformance.lean::readme"

