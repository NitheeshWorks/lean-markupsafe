name = "LeanMarkupsafe"
version = "0.1.0"
defaultTargets = ["LeanMarkupsafe", "Examples", "props", "conformance", "bench"]

# The verified library. Everything under LeanMarkupsafe/ except Transport.lean is a
# total function and the proof surface; see CONTRIBUTING.md.
[[lean_lib]]
name = "LeanMarkupsafe"
roots = ["LeanMarkupsafe", "LeanMarkupsafe.Raising"]

# Property tests for what is tested rather than proved. No dependencies, runs
# in well under a second: `lake exe props [seed]`.
[[lean_exe]]
name = "props"
root = "tests.Props"

# Conformance cases re-expressed from the upstream test suite:
# `lake exe conformance`. Each case names the upstream test it mirrors.
[[lean_exe]]
name = "conformance"
root = "tests.Conformance"

# Big inputs: escape, unescape, striptags, format and % on about 20 MB, each
# within 2 s and 300 MB peak memory: `lake exe bench`, run through
# stack-tools/capped.
[[lean_exe]]
name = "bench"
root = "tests.Bench"

# Ports of MarkupSafe's own examples: the code blocks of its README and docs
# pages (see examples/MANIFEST.toml). tests/Conformance.lean checks every value
# they print against MarkupSafe 3.0.4.
[[lean_lib]]
name = "Examples"
roots = ["examples.Readme", "examples.Index", "examples.Escaping", "examples.Html",
  "examples.Formatting"]

# The shared theory library: lawful codecs (Keel.Codec) restate the escape
# round trips as instances of one codec law.
[[require]]
name = "Keel"
git = "https://github.com/NitheeshWorks/lean-keel"
rev = "main"
