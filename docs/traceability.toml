# Traceability register: upstream behaviour -> Lean symbol -> theorem -> test.
#
# `scripts/traceability-check.py` validates it on every CI run: every
# `realises`/`theorem` symbol must resolve, every `test` path must exist.
#
# status: implemented | partial | tested | excluded | deviation
#   implemented  realised and proved
#   partial      realised, proof incomplete or covering a subset
#   tested       realised, deliberately tested rather than proved (say why)
#   excluded     out of scope, rejected by name
#   deviation    behaviour differs from upstream on purpose (say how)

[meta]
upstream_name = "MarkupSafe"
upstream_url = "https://github.com/pallets/markupsafe"
upstream_commit = "4e111271b1494995708a9e878a10829b5e10c7ba"
upstream_license = "BSD-3-Clause"

# [[requirement]]
# id = "..."                  # stable id, e.g. "routing.first-match"
# upstream = "tests/test_x.py::test_y"   # or a docs section
# title = "..."
# status = "implemented"
# realises = ["LeanMarkupsafe.Foo.bar"]
# theorem = ["LeanMarkupsafe.Foo.bar_spec"]
# test = ["tests/Conformance.lean::name"]

[[requirement]]
id = "escape.chars"
upstream = "tests/test_escape.py::test_escape"
title = "escape maps & < > \" ' to &amp; &lt; &gt; &#34; &#39; and nothing else"
status = "implemented"
realises = ["LeanMarkupsafe.escape", "LeanMarkupsafe.escapeChar", "LeanMarkupsafe.API.escape"]
theorem = ["LeanMarkupsafe.escape_sound", "LeanMarkupsafe.escapeChar_eq", "LeanMarkupsafe.escape_length"]
test = ["tests/Conformance.lean::escape", "tests/Props.lean::escape agrees with upstream's chained str.replace"]

[[requirement]]
id = "escape.sound"
upstream = "src/markupsafe/__init__.py::escape"
title = "escape output is escaped text (IsEscaped), the refinement on Markup"
status = "implemented"
realises = ["LeanMarkupsafe.IsEscaped", "LeanMarkupsafe.Escaped", "LeanMarkupsafe.Esc"]
theorem = ["LeanMarkupsafe.escape_sound", "LeanMarkupsafe.isEscaped_iff", "LeanMarkupsafe.esc_iff_roundtrip"]
test = ["tests/Props.lean::IsEscaped decides true on escape output"]

[[requirement]]
id = "escape.length"
upstream = "src/markupsafe/_native.py::_escape_inner"
title = "exact length of escape output"
status = "implemented"
realises = ["LeanMarkupsafe.escapedLength"]
theorem = ["LeanMarkupsafe.escape_length", "LeanMarkupsafe.escapeList_length"]
test = ["tests/pbt/Pbt.lean"]

[[requirement]]
id = "escape.markup-id"
upstream = "tests/test_markupsafe.py::test_escape_return_type"
title = "escaping a Markup (or any __html__ object) returns its HTML unchanged"
status = "implemented"
realises = ["LeanMarkupsafe.Markup.escape", "LeanMarkupsafe.ToMarkup", "LeanMarkupsafe.HasHtml"]
theorem = ["LeanMarkupsafe.escape_markup_id", "LeanMarkupsafe.escape_string"]
test = ["tests/Conformance.lean::escape_return_type", "tests/Conformance.lean::type_behavior"]

[[requirement]]
id = "html-protocol"
upstream = "tests/test_markupsafe.py::test_html_interop"
title = "__html__ / __html_format__ protocol as the HasHtml / HasHtmlFormat classes"
status = "implemented"
realises = ["LeanMarkupsafe.HasHtml", "LeanMarkupsafe.HasHtmlFormat", "LeanMarkupsafe.Markup.ofHtml", "LeanMarkupsafe.FormatArg.ofHtml", "LeanMarkupsafe.FormatArg.ofHtmlFormat"]
test = ["tests/Conformance.lean::html_interop", "tests/Conformance.lean::custom_formatting", "tests/Conformance.lean::complex_custom_formatting"]

[[requirement]]
id = "unescape.roundtrip"
upstream = "tests/test_markupsafe.py::test_unescape"
title = "unescape (escape s) = s, and escape (unescape s) = s on escaped text"
status = "implemented"
realises = ["LeanMarkupsafe.unescape", "LeanMarkupsafe.Markup.unescape", "LeanMarkupsafe.API.unescape"]
theorem = ["LeanMarkupsafe.unescape_escape", "LeanMarkupsafe.escape_unescape", "LeanMarkupsafe.escape_injective", "LeanMarkupsafe.escapeCodec", "LeanMarkupsafe.unescape_decode", "LeanMarkupsafe.escapeCodec_encode", "LeanMarkupsafe.escapedChar_escapeChar"]
test = ["tests/Conformance.lean::unescape", "tests/Props.lean::unescape (escape s) = s (smoke test of unescape_escape)"]

[[requirement]]
id = "unescape.html5"
upstream = "src/markupsafe/__init__.py::Markup.unescape"
title = "unescape follows html.unescape: HTML5 named table, longest-prefix fallback, decimal/hex references, WHATWG invalid-reference remapping"
status = "tested"
realises = ["LeanMarkupsafe.decodeRef", "LeanMarkupsafe.numericRef", "LeanMarkupsafe.namedRef", "LeanMarkupsafe.entityMap", "LeanMarkupsafe.lookupNamed"]
theorem = ["LeanMarkupsafe.decodeRef_length"]
test = ["tests/Conformance.lean::unescape_fixture", "tests/fixtures/unescape.txt", "tests/Conformance.lean::numeric_references", "tests/Conformance.lean::named_prefix_fallback", "tests/Conformance.lean::entity_table_size", "tests/Conformance.lean::entity_fast_path_agrees", "tests/Props.lean::decimal and hex numeric references agree"]
note = "Behaviour on arbitrary references is a table lookup against 2231 entries; agreement with the table is tested, not proved. Termination and the round trips are proved."

[[requirement]]
id = "concat"
upstream = "tests/test_markupsafe.py::test_adding"
title = "Markup + str escapes the str side (both __add__ and __radd__); invariant closed under concatenation"
status = "implemented"
realises = ["LeanMarkupsafe.Markup.append", "LeanMarkupsafe.Markup.concat", "LeanMarkupsafe.Markup.rconcat", "LeanMarkupsafe.API.append", "LeanMarkupsafe.API.appendString"]
theorem = ["LeanMarkupsafe.concat_markup_markup", "LeanMarkupsafe.concat_escapes", "LeanMarkupsafe.concat_string_closed"]
test = ["tests/Conformance.lean::adding", "tests/Conformance.lean::markup_docstring"]

[[requirement]]
id = "join"
upstream = "src/markupsafe/__init__.py::Markup.join"
title = "join escapes non-Markup items; invariant closed under join"
status = "implemented"
realises = ["LeanMarkupsafe.Markup.join", "LeanMarkupsafe.Markup.joinMarkup", "LeanMarkupsafe.API.join", "LeanMarkupsafe.API.joinEscaped"]
theorem = ["LeanMarkupsafe.join_closed", "LeanMarkupsafe.join_markup_closed"]
test = ["tests/Props.lean::join of strings is escaped"]

[[requirement]]
id = "format"
upstream = "tests/test_markupsafe.py::test_format"
title = "Markup.format / format_map escape every argument; invariant closed under format"
status = "implemented"
realises = ["LeanMarkupsafe.Markup.format", "LeanMarkupsafe.Markup.formatWith", "LeanMarkupsafe.Markup.formatMap", "LeanMarkupsafe.formatList", "LeanMarkupsafe.API.format"]
theorem = ["LeanMarkupsafe.format_closed", "LeanMarkupsafe.formatWith_closed", "LeanMarkupsafe.Markup.format_eq_formatWith", "LeanMarkupsafe.fill_escaped", "LeanMarkupsafe.argsSafe_proof"]
test = ["tests/Conformance.lean::format[named]", "tests/Conformance.lean::format_map", "tests/Conformance.lean::formatting_empty", "tests/Conformance.lean::formatting_with_objects"]

[[requirement]]
id = "mod"
upstream = "tests/test_markupsafe.py::test_tuple_interpol"
title = "Markup % args escapes every argument (tuple, single value, mapping); arity errors; invariant closed under %"
status = "implemented"
realises = ["LeanMarkupsafe.Markup.mod", "LeanMarkupsafe.percentList", "LeanMarkupsafe.API.modTuple", "LeanMarkupsafe.API.modMapping"]
theorem = ["LeanMarkupsafe.mod_closed"]
test = ["tests/Conformance.lean::tuple_interpol", "tests/Conformance.lean::dict_interpol", "tests/Conformance.lean::missing_interpol", "tests/Conformance.lean::interpolation"]

[[requirement]]
id = "format.deviation.access"
upstream = "tests/test_markupsafe.py::test_format"
title = "attribute/index access in format fields ({0[1][bar]}), !r conversions and nested specs"
status = "deviation"
realises = ["LeanMarkupsafe.FormatError.unsupported"]
test = ["tests/Conformance.lean::format[index access rejected: deviation]"]
note = "Lean values have no dynamic indexing; such fields return FormatError.unsupported. Callers pass the indexed value directly."

[[requirement]]
id = "format.deviation.specs"
upstream = "tests/test_markupsafe.py::test_string_interpolation"
title = "Python format specs for strings/numbers ({:>5}, %.2f, %5s, floats), %r/%a/%c"
status = "deviation"
realises = ["LeanMarkupsafe.percentConv", "LeanMarkupsafe.FormatArg.ofString", "LeanMarkupsafe.FormatArg.ofInt"]
test = ["tests/Conformance.lean::interpolation[%i] (integer argument)"]
note = "Only %s, %d, %i, %% and bare {} fields are supported; flags, widths, precisions and float conversions return FormatError.unsupported. Upstream's %i/%.2f cases use a float; here %i takes an Int. A HasHtmlFormat instance receives any spec."

[[requirement]]
id = "striptags"
upstream = "tests/test_markupsafe.py::test_escaping"
title = "striptags removes tags and comments, collapses whitespace, unescapes; no complete tag survives"
status = "implemented"
realises = ["LeanMarkupsafe.Markup.striptags", "LeanMarkupsafe.removeTags", "LeanMarkupsafe.collapseSpaces", "LeanMarkupsafe.API.striptags", "LeanMarkupsafe.NoCompleteTag"]
theorem = ["LeanMarkupsafe.striptags_no_tags", "LeanMarkupsafe.removeTags_no_lt", "LeanMarkupsafe.striptags_eq"]
test = ["tests/Conformance.lean::escaping", "tests/Conformance.lean::striptags_docstring", "tests/Props.lean::collapseSpaces output is normalised"]

[[requirement]]
id = "striptags.whitespace"
upstream = "src/markupsafe/__init__.py::Markup.striptags"
title = "whitespace collapse uses Python str.split() (Unicode whitespace)"
status = "tested"
realises = ["LeanMarkupsafe.isPySpace", "LeanMarkupsafe.words"]
test = ["tests/Props.lean::collapseSpaces output is normalised", "tests/Props.lean::collapseSpaces keeps the non-space characters in order"]
note = "Normalisation of the collapsed text is property-tested; the theorem catalogue covers tag removal only."

[[requirement]]
id = "escape-silent"
upstream = "tests/test_markupsafe.py::test_escape_silent"
title = "escape_silent maps None to empty Markup"
status = "implemented"
realises = ["LeanMarkupsafe.escapeSilent"]
theorem = ["LeanMarkupsafe.escapeSilent_spec"]
test = ["tests/Conformance.lean::escape_silent"]

[[requirement]]
id = "soft-str"
upstream = "tests/test_markupsafe.py::test_soft_str"
title = "soft_str keeps Markup as Markup, converts anything else to text"
status = "implemented"
realises = ["LeanMarkupsafe.softStr", "LeanMarkupsafe.SoftString", "LeanMarkupsafe.ToSoftString"]
theorem = ["LeanMarkupsafe.softStr_markup"]
test = ["tests/Conformance.lean::soft_str", "tests/Conformance.lean::soft_str_docstring"]

[[requirement]]
id = "markup.trusted"
upstream = "src/markupsafe/__init__.py::Markup.__new__"
title = "Markup(s) marks a string safe without escaping; Markup is a trusted wrapper, the IsEscaped refinement is the Escaped subtype"
status = "deviation"
realises = ["LeanMarkupsafe.Markup", "LeanMarkupsafe.Markup.markSafe", "LeanMarkupsafe.Escaped"]
test = ["tests/Conformance.lean::html_interop"]
note = "The plan sketched Markup := {s // IsEscaped s}; upstream Markup holds trusted HTML such as '<em>', which templates need, so Markup is a structure and Escaped := {m : Markup // IsEscaped m.str} carries the invariant."

[[requirement]]
id = "split-mul"
upstream = "tests/test_markupsafe.py::test_splitting"
title = "Markup.split (whitespace) and Markup * n"
status = "implemented"
realises = ["LeanMarkupsafe.Markup.split", "LeanMarkupsafe.Markup.times"]
test = ["tests/Conformance.lean::splitting[split]", "tests/Conformance.lean::mul"]

[[requirement]]
id = "str-methods"
upstream = "src/markupsafe/__init__.py::Markup (str method wrappers)"
title = "splitlines, rsplit with sep, partition, strip, ljust, replace and the other str wrappers"
status = "excluded"
note = "Thin wrappers that re-mark str results as Markup; not part of the surface lean-jinja2 needs. Callers use String functions on m.str and Markup.mk."

[[requirement]]
id = "python-object-model"
upstream = "tests/test_escape.py::test_proxy"
title = "proxy objects, str subclasses, exceptions from __html__ (test_proxy, test_subclass, test_exception_custom_html)"
status = "excluded"
note = "Python object-model behaviour with no Lean analogue: Lean types are nominal and HasHtml.html is a total function."

[[requirement]]
id = "speedups"
upstream = "tests/test_leak.py::test_markup_leaks"
title = "C speedups, reference leaks, extension init (test_leak, test_ext_init)"
status = "excluded"
note = "Implementation details of the CPython extension."

[[requirement]]
id = "format.interpolation"
upstream = "tests/test_markupsafe.py::test_string_interpolation"
title = "format/% on any (trusted HTML) template keep its literal text and replace each field by the rendering of the argument it names (positional in order, explicit index, keyword); string arguments appear as escape s"
status = "implemented"
realises = ["LeanMarkupsafe.Seg", "LeanMarkupsafe.Interpolates", "LeanMarkupsafe.InterpolatesAll", "LeanMarkupsafe.fieldRefs", "LeanMarkupsafe.API.formatTrusted", "LeanMarkupsafe.API.formatStrings", "LeanMarkupsafe.API.modTrusted", "LeanMarkupsafe.API.modStrings", "LeanMarkupsafe.API.modMappingTrusted"]
theorem = ["LeanMarkupsafe.format_interpolates", "LeanMarkupsafe.formatWith_interpolates", "LeanMarkupsafe.format_keywords", "LeanMarkupsafe.formatWith_strings", "LeanMarkupsafe.mod_tuple_interpolates", "LeanMarkupsafe.mod_mapping_interpolates", "LeanMarkupsafe.string_arg_rendering", "LeanMarkupsafe.format_strings", "LeanMarkupsafe.fill_escaped"]
test = ["tests/Conformance.lean::trusted_template_provenance"]

[[requirement]]
id = "mod.percent-d-text"
upstream = "src/markupsafe/__init__.py::_MarkupEscapeHelper.__int__"
title = "%d/%i of a string or Markup converts through int()"
status = "implemented"
realises = ["LeanMarkupsafe.parsePyInt", "LeanMarkupsafe.pyIntLiteral", "LeanMarkupsafe.percentIntOfText", "LeanMarkupsafe.intMaxStrDigits"]
theorem = ["LeanMarkupsafe.percentIntOfText_ok", "LeanMarkupsafe.string_arg_rendering"]
test = ["tests/Conformance.lean::percent_d_of_text", "tests/Conformance.lean::percent_d_digit_limit"]
note = "ASCII digits only; Python also accepts other Unicode decimal digits. A literal of more than 4300 digits is rejected, as CPython's int() does by default (sys.get_int_max_str_digits())."

[[requirement]]
id = "escape.none"
upstream = "tests/test_markupsafe.py::test_escape_silent"
title = "escape(None) is 'None'; escape_silent(None) is empty"
status = "implemented"
realises = ["LeanMarkupsafe.escapeSilent", "LeanMarkupsafe.Markup.escape"]
test = ["tests/Conformance.lean::escape_none", "tests/Conformance.lean::escape_silent"]

[[requirement]]
id = "concat.widening"
upstream = "src/markupsafe/__init__.py::Markup.__add__"
title = "Markup.concat accepts any ToMarkup value (numbers via toString); upstream Markup + 1 raises TypeError"
status = "deviation"
realises = ["LeanMarkupsafe.Markup.concat"]
theorem = ["LeanMarkupsafe.Markup.concat_closed"]
note = "Widening only: the right-hand side is still escaped. String ++ Markup and Markup ++ String match upstream exactly."

[[requirement]]
id = "unescape.huge-numeric"
upstream = "src/markupsafe/__init__.py::Markup.unescape"
title = "decimal references over 4300 digits"
status = "deviation"
realises = ["LeanMarkupsafe.numericRef"]
note = "Decoded as U+FFFD like any value above 0x10FFFF; CPython raises ValueError from sys.int_info.default_max_str_digits."

[[requirement]]
id = "format.error-text"
upstream = "src/markupsafe/__init__.py::Markup.format"
title = "error message for mixing automatic and manual field numbering"
status = "deviation"
realises = ["LeanMarkupsafe.FormatError.mixedNumbering"]
note = "One message for both directions; upstream has two wordings. The error case is the same."

[[requirement]]
id = "mod.positional-with-mapping"
upstream = "src/markupsafe/__init__.py::Markup.__mod__"
title = "positional %s with a mapping argument renders the mapping's repr upstream"
status = "deviation"
realises = ["LeanMarkupsafe.percentList"]
test = ["tests/Conformance.lean::positional_with_mapping"]
note = "FormatArg mappings have no repr; returns FormatError.unsupported. Mixed %(a)s and %s with a mapping errors in both."

[[requirement]]
id = "format.ergonomics"
upstream = "README.md (Examples)"
title = "format/% arguments written as plain strings, numbers and Markup; Markup % value, % [values], % (a, b), % [(key, value)]"
status = "implemented"
realises = ["LeanMarkupsafe.FormatArg.ofString", "LeanMarkupsafe.FormatArg.ofMarkup", "LeanMarkupsafe.FormatArg.ofNat", "LeanMarkupsafe.ToPercentArgs", "LeanMarkupsafe.ToArgTuple"]
test = ["tests/Conformance.lean::readme_examples", "tests/Conformance.lean::percent_plain_values"]

[[requirement]]
id = "mod.list-is-tuple"
upstream = "src/markupsafe/__init__.py::Markup.__mod__"
title = "a Python list on the right of % is one value (its repr); a Lean list is the argument tuple"
status = "deviation"
realises = ["LeanMarkupsafe.ToPercentArgs"]
test = ["tests/Conformance.lean::percent_list_is_tuple"]
note = "Markup('%s') % ['<a>'] is Markup('[&#39;&lt;a&gt;&#39;]') in 3.0.4; Lean's % [\"<a>\"] is &lt;a&gt;. FormatArg has no repr."

[[requirement]]
id = "markup.of"
upstream = "src/markupsafe/__init__.py::Markup.__new__"
title = "Markup(obj): a string as is, __html__ objects by their rendering, anything else by str(), unescaped"
status = "implemented"
realises = ["LeanMarkupsafe.Markup.of", "LeanMarkupsafe.Markup.ToMarkupSafe", "LeanMarkupsafe.noneToMarkup"]
test = ["tests/Conformance.lean::docs_escaping_markup", "tests/Conformance.lean::docs_html", "tests/Conformance.lean::docs_escaping_silent"]

[[requirement]]
id = "examples.docs"
upstream = "docs/ (README.md, index.rst, escaping.rst, html.rst, formatting.rst)"
title = "MarkupSafe's own docs examples, ported 1:1 and checked against MarkupSafe 3.0.4"
status = "implemented"
note = "Where a docs page shows a different output than 3.0.4 prints (UP-043), the ports and checks follow the package."
realises = ["LeanMarkupsafe.escape", "LeanMarkupsafe.Markup.of", "LeanMarkupsafe.Markup.format", "LeanMarkupsafe.HasHtmlFormat"]
test = ["examples/MANIFEST.toml", "examples/Readme.lean", "examples/Index.lean", "examples/Escaping.lean", "examples/Html.lean", "examples/Formatting.lean", "tests/Conformance.lean::docs_formatting"]

[[requirement]]
id = "execution.in-place"
upstream = "src/markupsafe/_speedups.c (escape in one pass); Python str methods"
title = "escape, unescape, striptags, split, format, %, join and * run in place: constant stack, linear time and memory, proved equal to the specifications"
status = "implemented"
realises = ["LeanMarkupsafe.escapeFast", "LeanMarkupsafe.unescapeFast", "LeanMarkupsafe.Markup.striptagsFast", "LeanMarkupsafe.Markup.splitFast", "LeanMarkupsafe.Markup.formatWithFast", "LeanMarkupsafe.Markup.modFast", "LeanMarkupsafe.Markup.joinMarkupFast", "LeanMarkupsafe.Markup.timesFast", "LeanMarkupsafe.pyDigitsFast", "LeanMarkupsafe.pyIntLiteralFast", "LeanMarkupsafe.percentIntOfTextFast", "LeanMarkupsafe.pyIntDigitCount", "LeanMarkupsafe.renderFieldA", "LeanMarkupsafe.Cursor.rest"]
theorem = ["LeanMarkupsafe.escape_eq_fast", "LeanMarkupsafe.unescape_eq_fast", "LeanMarkupsafe.Markup.striptags_eq_fast", "LeanMarkupsafe.Markup.split_eq_fast", "LeanMarkupsafe.Markup.formatWith_eq_fast", "LeanMarkupsafe.Markup.mod_eq_fast", "LeanMarkupsafe.Markup.joinMarkup_eq_fast", "LeanMarkupsafe.Markup.times_eq_fast", "LeanMarkupsafe.pyDigits_eq_fast", "LeanMarkupsafe.pyIntLiteral_eq_fast", "LeanMarkupsafe.percentIntOfText_eq_fast", "LeanMarkupsafe.renderFieldA_toArray", "LeanMarkupsafe.theVerifiedExecution"]
test = ["tests/Bench.lean"]
note = "Each specification is stated on List Char; the @[csimp] lemma makes the compiler run the in-place version. lake exe bench: 20 MB inputs, each within 2 s and 300 MB peak memory."
